<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKLCH Theme Token Generator</title>
    <!-- Font Imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
    <!-- Material Symbols Import -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <script type="module" src="/src/main.js" defer></script>
</head>
<body>
    <main class="container">
        <aside class="controls">
            <header class="app-header">
                <img class="logo" src="https://www.journaltech.com/hs-fs/hubfs/Journal_Logo-150.png?width=225&height=80&name=Journal_Logo-150.png" alt="Journal Technologies Logo">
                <div class="divider"></div>
                <h1>Theme Token Generator</h1>
            </header>
            
            <!-- MOVED: Max Chroma Boost is now the first control -->
            <div class="control-group" id="chroma-group">
                <label for="chroma-slider">Max Chroma Boost (<span id="chroma-value">150</span>%)</label>
                <input type="range" id="chroma-slider" min="0" max="200" value="150">
            </div>

            <!-- Mode Switcher -->
            <div class="control-group" id="mode-switcher">
                <label>Mode</label>
                <div class="radio-group">
                    <input type="radio" id="mode-existing" name="theme-mode" value="existing" checked>
                    <label for="mode-existing">Existing Themes</label>
                    <input type="radio" id="mode-custom" name="theme-mode" value="custom">
                    <label for="mode-custom">Custom Theme</label>
                </div>
            </div>

            <!-- Existing Theme Controls -->
            <div id="existing-theme-controls">
                <div class="control-group">
                    <label for="theme-select">Select Theme</label>
                    <select id="theme-select"></select>
                </div>
            </div>

            <!-- Custom Theme Controls -->
            <div id="custom-theme-controls" class="hidden">
                <!-- UPDATED: Sliders are now wrapped for horizontal layout -->
                <div class="control-group-row">
                    <div class="control-group">
                        <label for="hue-slider">Hue (<span id="hue-value">259</span>°)</label>
                        <input type="range" id="hue-slider" min="0" max="360" value="259">
                    </div>
                    <div class="control-group">
                        <label for="chroma-slider-custom">Chroma (<span id="chroma-value-custom">0.150</span>)</label>
                        <input type="range" id="chroma-slider-custom" min="0" max="0.2810" step="0.001" value="0.15">
                    </div>
                </div>
            </div>
            
            <div class="control-group-row">
                <input type="checkbox" id="animate-toggle" checked>
                <label for="animate-toggle">Animate Theme Change</label>
            </div>
            
            <div class="control-group export-group">
                <div class="export-header">
                    <label for="css-output">Export CSS Tokens</label>
                </div>
                <button id="export-button" class="btn btn-primary">
                    <span class="material-symbols-outlined">content_copy</span>
                    <span id="copy-button-text">Copy Tokens</span>
                </button>
                <div class="export-wrapper">
                    <textarea id="css-output" rows="13" readonly></textarea>
                </div>
            </div>
        </aside>

        <section class="content-wrapper">
            <header class="content-header">
                <h2 id="theme-title">Default Blue</h2>
                <div class="theme-swatch-info" id="theme-swatch-info">
                    <div class="color-swatch"></div>
                    <div class="value-text"></div>
                </div>
            </header>
            <div class="visualization">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Token</th>
                                <th>Swatch</th>
                                <th>Value</th>
                            </tr>
                        </thead>
                        <tbody id="token-table-body">
                            <!-- Rows will be generated by JavaScript Changes -->
                        </tbody>
                    </table>
                </div>
                <div class="chart-container">
                    <div class="chart-wrapper">
                        <canvas id="chroma-chart"></canvas>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="lightness-chart"></canvas>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
